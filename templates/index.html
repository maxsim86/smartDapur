<!DOCTYPE html>
<html>
<head>
    <title>Smart Pantry</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .scanner-box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 20px; }
        .list-item { background: white; padding: 10px; margin: 5px 0; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .low-stock { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📦 Smart Pantry</h1>
    
    <div class="scanner-box">
        <form method="POST" action="/">
            <label>Scan Barcode:</label><br>
            <input type="text" name="barcode" id="barcodeInput" autofocus>
            <br><br>
            <button type="submit" name="action" value="add">➕ Masuk Stok</button>
            <button type="submit" name="action" value="remove">➖ Keluar Stok (Masak)</button>
        </form>
    </div>

    <h3>Inventori Semasa:</h3>
    <div>
        {% for item in items %}
        <div class="list-item">
            <span>{{ item[1] }} ({{ item[0] }})</span>
            <span class="{{ 'low-stock' if item[2] < 2 else '' }}">
                Stok: {{ item[2] }}
            </span>
        </div>
        {% endfor %}
    </div>

    <script>
        // Pastikan cursor sentiasa di kotak scan
        document.getElementById("barcodeInput").focus();
        document.addEventListener("click", function() {
            document.getElementById("barcodeInput").focus();
        });
    </script>
</body>
</html>
